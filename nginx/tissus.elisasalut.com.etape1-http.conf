# ÉTAPE 1 — Configuration HTTP seule, à utiliser AVANT d'avoir un certificat SSL.
# Objectif : rendre le site accessible en http:// le temps que Certbot obtienne
# le certificat, puis laisser Certbot compléter automatiquement la config HTTPS.
#
# INSTALLATION :
#   1. Vérifiez d'abord que le DNS pointe bien vers ce serveur :
#        dig +short tissus.elisasalut.com
#      (doit renvoyer l'adresse IP publique de ce serveur — sinon Certbot échouera)
#
#   2. Copiez ce fichier comme configuration active du site :
#        sudo cp tissus.elisasalut.com.etape1-http.conf /etc/nginx/sites-available/tissus.elisasalut.com.conf
#        sudo ln -s /etc/nginx/sites-available/tissus.elisasalut.com.conf /etc/nginx/sites-enabled/
#
#   3. Testez et rechargez Nginx (doit réussir, aucun certificat n'est référencé ici) :
#        sudo nginx -t && sudo systemctl reload nginx
#
#   4. Vérifiez qu'aucun ancien certificat mal nommé n'existe déjà :
#        sudo certbot certificates
#      Si vous voyez un certificat nommé simplement "tissus" (au lieu de
#      "tissus.elisasalut.com"), supprimez-le pour repartir propre :
#        sudo certbot delete --cert-name tissus
#
#   5. Installez Certbot si besoin, puis demandez le certificat :
#        sudo apt install -y certbot python3-certbot-nginx
#        sudo certbot --nginx -d tissus.elisasalut.com
#
#      Certbot va : obtenir le certificat, modifier lui-même ce fichier pour
#      ajouter le bloc HTTPS (port 443) avec les bons chemins, et proposer de
#      mettre en place la redirection HTTP -> HTTPS automatiquement (répondez
#      "oui"/"2" quand il le demande).
#
#   6. Vérifiez le résultat :
#        sudo nginx -t && sudo systemctl reload nginx
#        curl -I https://tissus.elisasalut.com
#
# Le fichier "tissus.elisasalut.com.conf" (à côté de celui-ci) montre à quoi
# doit ressembler la configuration finale une fois Certbot passé — à titre de
# comparaison, vous n'avez normalement pas besoin de le copier manuellement.

server {
    listen 80;
    listen [::]:80;
    server_name tissus.elisasalut.com;

    # Nécessaire pour la validation du certificat Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
