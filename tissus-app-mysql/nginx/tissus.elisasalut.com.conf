# Configuration Nginx pour tissus.elisasalut.com
# Reverse proxy vers l'application Node.js "Gestion Tissus" (port local 3000)
#
# ⚠️ IMPORTANT — À FAIRE EN DEUX ÉTAPES :
#
#   ÉTAPE 1 : utilisez d'abord le fichier "tissus.elisasalut.com.etape1-http.conf"
#             (dans ce même dossier) pour activer le site en HTTP simple et
#             obtenir le certificat SSL avec Certbot.
#
#   ÉTAPE 2 : une fois le certificat obtenu, Certbot réécrit automatiquement
#             la configuration pour ajouter le bloc HTTPS ci-dessous (avec
#             les bons chemins de certificat) et met en place la redirection
#             HTTP -> HTTPS. Vous n'avez normalement PAS besoin de copier ce
#             fichier-ci manuellement : il est fourni à titre de référence,
#             pour vérifier que la configuration générée par Certbot y
#             ressemble bien, ou pour la recréer si besoin.
#
# Si vous voulez malgré tout l'utiliser directement (par exemple pour
# recréer la config après un "certbot delete"), copiez-le seulement APRÈS
# avoir vérifié que ces deux fichiers existent bien sur le serveur :
#   /etc/letsencrypt/live/tissus.elisasalut.com/fullchain.pem
#   /etc/letsencrypt/live/tissus.elisasalut.com/privkey.pem
# (vérifiable avec : sudo certbot certificates)

# --- Bloc HTTP (port 80) ---
server {
    listen 80;
    listen [::]:80;
    server_name tissus.elisasalut.com;

    # Nécessaire pour le renouvellement futur du certificat Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Bloc HTTPS (port 443) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tissus.elisasalut.com;

    # Chemins générés automatiquement par "certbot --nginx" :
    ssl_certificate     /etc/letsencrypt/live/tissus.elisasalut.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tissus.elisasalut.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Taille max des requêtes (formulaires, notes...) — augmentez si besoin
    client_max_body_size 10M;

    access_log /var/log/nginx/tissus.elisasalut.com.access.log;
    error_log  /var/log/nginx/tissus.elisasalut.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support des connexions longues / websockets (au cas où utilisé plus tard)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
